<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Navratri - Ashish</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            background: #11001c;
        }

        /* Initial Landing Screen */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #4a0000, #1a0033);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .welcome-title {
            color: #ffd700;
            font-size: 2rem;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 10px #ff4500;
            animation: pulseText 2s infinite;
        }

        /* Touch Button Style */
        .welcome-btn {
            background: linear-gradient(45deg, #ff8c00, #ff0000);
            color: white;
            border: 3px solid #ffd700;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 140, 0, 0.8);
            transition: transform 0.2s, box-shadow 0.2s;
            animation: bounceBtn 1.5s infinite;
        }

        .welcome-btn:hover, .welcome-btn:active {
            transform: scale(1.08);
            box-shadow: 0 0 40px #ffd700;
        }

        /* Main Greeting Card Screen */
        #main-screen {
            position: relative;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #3d001a 0%, #0d001a 100%);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            overflow: hidden;
        }

        /* Header / Sender Info */
        .header-greeting {
            text-align: center;
            z-index: 10;
            animation: slideDown 1s ease-out;
        }

        .header-greeting h3 {
            color: #ffcc00;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header-greeting h1 {
            color: #ff3333;
            font-size: 2.5rem;
            text-shadow: 0 0 15px #ff0000, 0 0 25px #ffcc00;
            margin-top: 5px;
        }

        /* Center Durga Mata Stage */
        .mata-container {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            animation: zoomIn 1.2s ease-out;
        }

        .mata-glow {
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,215,0,0.6) 0%, rgba(255,69,0,0) 70%);
            animation: rotateGlow 10s linear infinite;
        }

        .mata-photo {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            border: 4px solid #ffd700;
            object-fit: cover;
            box-shadow: 0 0 30px #ff9900;
            position: relative;
            z-index: 2;
        }

        /* Blessings / Wish Message */
        .wish-card {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #ffd700;
            border-radius: 15px;
            padding: 15px 25px;
            text-align: center;
            max-width: 450px;
            z-index: 10;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            animation: fadeInUp 1.5s ease-out;
        }

        .wish-card p {
            color: #fff;
            font-size: 1rem;
            line-height: 1.5;
        }

        .signature {
            margin-top: 10px;
            color: #ffcc00;
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* Floating Flower Petals and Lights */
        .particle {
            position: absolute;
            background: #ffcc00;
            border-radius: 50%;
            pointer-events: none;
            animation: fall linear infinite;
        }

        /* Animations */
        @keyframes pulseText {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @keyframes bounceBtn {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes slideDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes zoomIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeInUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes rotateGlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes fall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0.2;
            }
        }
    </style>
</head>
<body>

    <!-- Welcome / Entry Screen -->
    <div id="welcome-screen">
        <div class="welcome-title">✨ Divine Navratri Blessings Await ✨</div>
        <button class="welcome-btn" onclick="revealCelebration()">Welcome Maiya</button>
    </div>

    <!-- Main Live Animated Screen -->
    <div id="main-screen">
        <div class="header-greeting">
            <h3> শুভ নবরাত্রি • Happy Navratri</h3>
            <h1>Maa Durga Blessings</h1>
        </div>

        <div class="mata-container">
            <div class="mata-glow"></div>
            <!-- Using a high-quality Durga Mata placeholder image link -->
            <img src="https://images.unsplash.com/photo-1603228245466-f3bb40621ad2?auto=format&fit=crop&w=600&q=80" alt="Durga Mata" class="mata-photo">
        </div>

        <div class="wish-card">
            <p>May Maa Durga empower you and your family with her 9 divine forms of name, fame, health, wealth, happiness, and humanity!</p>
            <div class="signature">With Warm Regards,<br>✨ Ashish ✨</div>
        </div>
    </div>

    <script>
        function revealCelebration() {
            const welcomeScreen = document.getElementById('welcome-screen');
            const mainScreen = document.getElementById('main-screen');

            // Fade out welcome screen
            welcomeScreen.style.opacity = '0';
            welcomeScreen.style.transform = 'scale(1.1)';
            
            setTimeout(() => {
                welcomeScreen.style.display = 'none';
                mainScreen.style.display = 'flex';
                startParticles();
            }, 800);
        }

        // Background falling flower/sparkle animation generator
        function startParticles() {
            const particleCount = 35;
            const container = document.getElementById('main-screen');

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Random properties for rich visual effect
                const size = Math.random() * 8 + 4;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}vw`;
                particle.style.top = `-${Math.random() * 20}px`;
                
                // Color variation (Gold, Orange, Red)
                const colors = ['#ffd700', '#ff4500', '#ff8c00', '#ff3333'];
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                const duration = Math.random() * 3 + 3; // 3 to 6 seconds
                const delay = Math.random() * 5;
                
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${delay}s`;

                container.appendChild(particle);
            }
        }
    </script>
</body>
</html>
